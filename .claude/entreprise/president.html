<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Gabarit du tableau /president. Le Président ne modifie QUE le bloc JSON #presidence en bas de page (schéma dans .claude/commands/president.md). */
:root{
  --bg:#f7f7f6; --surface:#ffffff; --fg:#111111; --muted:#6b6b6b; --line:#e5e5e3; --soft:#f0f0ee;
  --pres:#111111; --dir:#2f5bd3; --mem:#8a8a8a; --theo:#d6336c; --ctrl:#0b7285; --diable:#c92a2a; --ceo:#7a1f24; --canvas:#fbfaf7;

  --display:"Inter Tight",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0e0e; --surface:#171717; --fg:#f2f2f2; --muted:#9a9a9a; --line:#2a2a2a; --soft:#1f1f1f;
  --pres:#f2f2f2; --dir:#6f93ff; --mem:#8a8a8a; --theo:#f06595; --ctrl:#3bc9db; --diable:#ff6b6b; --ceo:#b8434a; --canvas:#121212;
  --debat:#ff6b6b; --question:#6f93ff; --coordination:#777777; --livrable:#51cf66; --alerte:#ffa94d;
  --ok:#51cf66; --warn:#ffa94d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e0e; --surface:#171717; --fg:#f2f2f2; --muted:#9a9a9a; --line:#2a2a2a; --soft:#1f1f1f;
  --pres:#f2f2f2; --dir:#6f93ff; --mem:#8a8a8a; --theo:#f06595; --ctrl:#3bc9db; --diable:#ff6b6b; --ceo:#b8434a; --canvas:#121212;
  --debat:#ff6b6b; --question:#6f93ff; --coordination:#777777; --livrable:#51cf66; --alerte:#ffa94d;
  --ok:#51cf66; --warn:#ffa94d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.85rem;font-weight:800;letter-spacing:-.01em} h2{font-size:1.05rem;font-weight:700;margin-bottom:12px} h3{font-size:.92rem;font-weight:700}
p{margin:0}
a{color:var(--dir)}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .empty{color:var(--muted);font-style:italic;font-size:.88rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:.72rem;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.top{display:flex;flex-direction:column;gap:10px}
.q{font-size:1rem;max-width:80ch}
/* Consultation */
.consult{border:2px solid var(--theo);background:var(--surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.consult.done{border-width:1px;border-color:var(--line)}
.choice{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.86rem;background:var(--soft)}
/* Partition */
.phases{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.phase{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.84rem}
.phase.encours{border:2px solid var(--theo)} .phase.prevue{border-style:dashed;color:var(--muted)} .phase.faite{background:var(--soft)}
.phase .meta{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
/* Organigramme */
.main{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.org{display:flex;flex-direction:column;align-items:center;gap:0}
.card{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;width:100%}
.card:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.card.sel{box-shadow:0 0 0 2px var(--fg)}
.card .nm{font-weight:600;font-size:.9rem;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.card .rf{font-size:.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prescard{max-width:340px}
.toprow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:stretch;width:100%}
.toprow .card{max-width:340px;flex:1 1 220px}
.ctrlcard{border-style:dashed;border-top-style:solid}
.verdict{font-family:var(--mono);font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:999px;color:#fff;white-space:nowrap}
.verdict.GO{background:var(--ok)} .verdict.NO-GO{background:var(--debat)} .verdict.attente{background:var(--mem)}
.ctrl{display:flex;flex-direction:column;gap:8px;font-size:.84rem}
.ctrl div{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:8px}
.stem{width:2px;height:18px;background:var(--line)}
.dirs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:100%;border-top:2px solid var(--line);padding-top:18px}
.dircol{display:flex;flex-direction:column;gap:6px;min-width:0}
.mems{display:flex;flex-direction:column;gap:4px;padding-left:12px;border-left:2px solid var(--line);margin-left:10px}
.mem{font:inherit;color:inherit;text-align:left;background:var(--soft);border:1px solid transparent;border-radius:6px;padding:4px 8px;font-size:.78rem;cursor:pointer;display:flex;justify-content:space-between;gap:6px}

.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}

.tag{font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;color:#fff;background:var(--c);white-space:nowrap}

.issue{font-size:.82rem;border-top:1px solid var(--line);padding-top:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.livr{display:flex;flex-direction:column;gap:10px}
.livr div{display:flex;flex-direction:column;gap:2px;font-size:.86rem}
.synth{display:flex;flex-direction:column;gap:10px;font-size:.9rem}
.synth b{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block}
.journal{display:flex;flex-direction:column;gap:4px;font-size:.8rem;max-height:320px;overflow:auto}
.journal div{display:grid;grid-template-columns:3.2em 7em 1fr;gap:8px}
.journal .t{font-family:var(--mono);color:var(--muted)}
.gpanel{display:flex;flex-direction:column;gap:10px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.gtools{display:flex;gap:6px}
.gtools button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:6px;padding:3px 10px;cursor:pointer;min-width:32px}
.gtools button:focus-visible{outline:2px solid var(--fg)}
.gwrap{border:1px solid var(--line);border-radius:10px;background:var(--canvas);overflow:hidden}
svg.graph{display:block;width:100%;height:auto;aspect-ratio:1000/720;cursor:grab;touch-action:none;user-select:none}
svg.graph:active{cursor:grabbing}
.edge{stroke:var(--ceo);stroke-opacity:.45;stroke-width:1.6}
.edge.deep{stroke-opacity:.3;stroke-width:1.1}
.edge.on{stroke-opacity:.9;stroke-width:2.2}
.comm{fill:none;stroke-width:1.6;stroke-dasharray:6 5;opacity:.55}
.comm.live{opacity:1;stroke-width:2.2;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.gnode{cursor:pointer;outline:none}
.gnode .disc{fill:var(--surface);stroke-width:2}
.gnode.sel .disc{stroke-width:4}
.gnode:focus-visible .disc{stroke-dasharray:4 3}
.gnode .letter{font-family:var(--mono);font-size:13px;font-weight:600}
.gnode .ceo{font-family:var(--display);font-size:17px;font-weight:800;fill:#fff}
.gnode .lbl{font-family:var(--body);font-size:12px;fill:var(--fg)}
.gnode .lbl.l1{font-family:var(--display);font-size:13.5px;font-weight:700}
.gnode.attente .disc{stroke-dasharray:3 3}
.gnode .disc[style*="--ceo"]{stroke-dasharray:none}
.gnode.archive{opacity:.4}
.halo{fill:none;stroke-width:2;opacity:.5;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){.comm.live,.halo{animation:none}}
.ln{width:18px;height:0;border-top:2px solid var(--ceo);display:inline-block;opacity:.7}
.ln.dash{border-top-style:dashed;border-color:var(--debat)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.75rem;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
</style>

<script>
(function(){
  var data;
  try { data = JSON.parse(document.getElementById('presidence').textContent); }
  catch (e) { document.getElementById('app').textContent = 'Bloc JSON invalide : ' + e.message; return; }

  var arr = function(x){ return Array.isArray(x) ? x : []; };
  var equipe = arr(data.equipe), fils = arr(data.fils);
  var byId = {}; equipe.forEach(function(m){ byId[m.id] = m; });
  var nom = function(id){ return byId[id] ? byId[id].nom : id; };
  var ETATS = {attente:'en attente', travail:'au travail', debat:'en débat', fini:'fini', pause:'en pause', archive:'archivé'};
  var FILS = {debat:'débat', question:'question', coordination:'coordination', livrable:'livrable', alerte:'alerte'};
  var COLOR = {president:'var(--pres)', directeur:'var(--dir)', controle:'var(--ctrl)', contradicteur:'var(--diable)', membre:'var(--mem)', theophile:'var(--theo)'};
  var selected = 'president';
  try { selected = localStorage.getItem('presidence-sel') || selected; } catch (e) {}
  if (!byId[selected]) selected = equipe.length ? equipe[0].id : null;

  function h(tag, attrs){
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === 'class') el.className = attrs[k];
      else if (k === 'style') el.setAttribute('style', attrs[k]);
      else if (k.slice(0,2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(function(x){ if (x != null) el.append(x); });
      else el.append(c);
    }
    return el;
  }
  function safeUrl(u){ return (typeof u === 'string' && /^https:\/\//.test(u)) ? u : null; }
  function sessionUrl(s){ return (typeof s === 'string' && /^session_[A-Za-z0-9]+$/.test(s)) ? 'https://claude.ai/code/' + s : null; }
  function stateChip(m){ return h('span', {class:'state ' + (m.etat || '')}, ETATS[m.etat] || m.etat || ''); }
  function liveWith(id){
    return fils.filter(function(f){ return f.live && arr(f.participants).indexOf(id) >= 0; })
      .map(function(f){ return arr(f.participants).filter(function(p){ return p !== id; }).map(nom).join(', '); })
      .filter(Boolean);
  }
  function select(id){ selected = id; try { localStorage.setItem('presidence-sel', id); } catch (e) {} render(); }

  function card(m, extra){
    var talks = liveWith(m.id);
    return h('button', {class:'card ' + (extra || '') + (selected === m.id ? ' sel' : ''), style:'--c:' + (COLOR[m.type] || 'var(--mem)'), type:'button', onclick:function(){ select(m.id); }, 'aria-pressed': selected === m.id ? 'true' : 'false'},
      h('span', {class:'nm'}, h('span', null, m.nom), stateChip(m)),
      m.reflexion ? h('span', {class:'rf'}, m.reflexion) : (m.mission ? h('span', {class:'rf'}, m.mission) : null),
      talks.length ? h('span', {class:'talk'}, 'échange avec ' + talks.join(', ')) : null);
  }

  var view = null, dragged = false;
  var NS = 'http://www.w3.org/2000/svg';
  function sv(tag, attrs){
    var el = document.createElementNS(NS, tag);
    if (attrs) Object.keys(attrs).forEach(function(k){ el.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c != null) el.append(c); }
    return el;
  }
  var LETTRE = {president:'', directeur:'D', contradicteur:'!', controle:'✓', membre:'M', theophile:'T'};
  var GW = 1000, GH = 720;

  function layout(){
    var pres = equipe.filter(function(m){ return m.type === 'president'; })[0];
    var pos = {}, kids = {};
    equipe.forEach(function(m){ if (m.parent && byId[m.parent] && m.id !== m.parent) (kids[m.parent] = kids[m.parent] || []).push(m); });
    function count(id, seen){ seen = seen || {}; if (seen[id]) return 0; seen[id] = 1; return (kids[id] || []).reduce(function(s, c){ return s + 1 + count(c.id, seen); }, 0); }
    var rootId = pres ? pres.id : null;
    var lvl1 = equipe.filter(function(m){ return m.type !== 'president' && (!m.parent || !byId[m.parent] || m.parent === rootId); });
    var weights = lvl1.map(function(m){ return 1 + 0.3 * Math.min(count(m.id), 10); });
    var total = weights.reduce(function(a, b){ return a + b; }, 0) || 1;
    var cx = GW / 2, cy = GH / 2, a0 = -Math.PI / 2, acc = 0;
    if (pres) pos[pres.id] = {x:cx, y:cy, r:62, depth:0, a:0};
    var R1 = lvl1.length > 8 ? 260 : 230;
    lvl1.forEach(function(m, i){
      var a = a0 + 2 * Math.PI * (acc + weights[i] / 2) / total; acc += weights[i];
      pos[m.id] = {x:cx + R1 * Math.cos(a), y:cy + R1 * Math.sin(a), r:26, depth:1, a:a};
      place(m.id, a, 2);
    });
    function place(pid, dir, depth){
      var ch = kids[pid] || []; if (!ch.length || depth > 6) return;
      var p = pos[pid], rc = depth === 2 ? 170 : 120;
      var step = Math.max(10, Math.min(26, 240 / ch.length)) * Math.PI / 180;
      var start = dir - step * (ch.length - 1) / 2;
      ch.forEach(function(c, k){
        if (pos[c.id]) return;
        var a = start + k * step;
        pos[c.id] = {x:p.x + rc * Math.cos(a), y:p.y + rc * Math.sin(a), r:17, depth:depth, a:a};
        place(c.id, a, depth + 1);
      });
    }
    return pos;
  }

  function fitView(pos){
    var xs = [], ys = [];
    Object.keys(pos).forEach(function(k){ xs.push(pos[k].x); ys.push(pos[k].y); });
    if (!xs.length) return {x:0, y:0, k:1};
    var minx = Math.min.apply(null, xs) - 170, maxx = Math.max.apply(null, xs) + 170;
    var miny = Math.min.apply(null, ys) - 150, maxy = Math.max.apply(null, ys) + 150;
    var k = Math.min(GW / (maxx - minx), GH / (maxy - miny), 1.25);
    return {k:k, x:GW / 2 - k * (minx + maxx) / 2, y:GH / 2 - k * (miny + maxy) / 2};
  }

  function wrap(txt, max){
    var lines = [], cur = '';
    String(txt).split(' ').forEach(function(w){
      if (cur && (cur + ' ' + w).length > max) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
    });
    if (cur) lines.push(cur);
    if (lines.length > 2) lines = [lines[0], lines.slice(1).join(' ').slice(0, max - 1) + '…'];
    return lines;
  }

  function graph(){
    var pos = layout();
    if (!view) view = fitView(pos);
    var g = sv('g', {transform:'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')'});
    var edges = sv('g'), comms = sv('g'), nodes = sv('g');
    g.append(edges, comms, nodes);
    equipe.forEach(function(m){
      var p = pos[m.id], q = pos[m.parent];
      if (!p || !q) return;
      var actif = m.etat === 'travail' || m.etat === 'debat';
      edges.append(sv('line', {x1:q.x, y1:q.y, x2:p.x, y2:p.y, class:'edge' + (actif ? ' on' : '') + (p.depth > 1 ? ' deep' : '')}));
    });
    fils.forEach(function(f){
      var parts = arr(f.participants).filter(function(id){ return pos[id]; });
      var col = 'var(--' + (FILS[f.type] ? f.type : 'coordination') + ')';
      for (var i = 1; i < parts.length; i++) {
        var a = pos[parts[0]], b = pos[parts[i]];
        var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y;
        var cxp = mx - dy * 0.25, cyp = my + dx * 0.25;
        var path = sv('path', {d:'M' + a.x + ' ' + a.y + ' Q' + cxp + ' ' + cyp + ' ' + b.x + ' ' + b.y, class:'comm' + (f.live ? ' live' : ''), style:'stroke:' + col});
        path.append(sv('title', null, f.sujet));
        comms.append(path);
      }
    });
    equipe.forEach(function(m){
      var p = pos[m.id]; if (!p) return;
      var col = COLOR[m.type] || 'var(--mem)';
      var isPres = m.type === 'president', sel = selected === m.id;
      var node = sv('g', {class:'gnode' + (sel ? ' sel' : '') + ' ' + (m.etat || ''), transform:'translate(' + p.x + ',' + p.y + ')', tabindex:'0', role:'button', 'aria-label':m.nom + ', ' + (ETATS[m.etat] || '')});
      if (m.etat === 'travail' || m.etat === 'debat') node.append(sv('circle', {r:p.r + 6, class:'halo', style:'stroke:' + col}));
      node.append(sv('circle', {r:p.r, class:'disc', style:isPres ? 'fill:var(--ceo);stroke:var(--ceo)' : 'stroke:' + col}));
      node.append(sv('text', {class:isPres ? 'ceo' : 'letter', 'text-anchor':'middle', dy:'.35em', style:isPres ? '' : 'fill:' + col}, isPres ? m.nom : (LETTRE[m.type] || 'A')));
      if (!isPres) {
        if (p.depth <= 1) {
          var t = sv('text', {class:'lbl l1', 'text-anchor':'middle', y:p.r + 17});
          wrap(m.court || m.nom, 18).forEach(function(line, k){ t.append(sv('tspan', {x:0, dy:k ? '1.15em' : 0}, line)); });
          node.append(t);
        } else {
          var deg = p.a * 180 / Math.PI, flip = Math.cos(p.a) < 0;
          node.append(sv('text', {class:'lbl', 'text-anchor':flip ? 'end' : 'start', dy:'.35em', transform:'rotate(' + (flip ? deg + 180 : deg) + ') translate(' + (flip ? -(p.r + 6) : p.r + 6) + ',0)'}, m.nom));
        }
      }
      node.addEventListener('click', function(e){ if (dragged) return; e.stopPropagation(); select(m.id); });
      node.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(m.id); } });
      nodes.append(node);
    });
    var svg = sv('svg', {class:'graph', viewBox:'0 0 ' + GW + ' ' + GH, role:'img', 'aria-label':'Graphe de l’entreprise'}, g);
    var drag = null;
    function apply(){ g.setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')'); }
    function ratio(){ return GW / (svg.getBoundingClientRect().width || GW); }
    svg.addEventListener('pointerdown', function(e){ drag = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y, moved:false}; dragged = false; });
    svg.addEventListener('pointermove', function(e){
      if (!drag) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; dragged = true; try { svg.setPointerCapture(e.pointerId); } catch (err) {} }
      if (drag.moved) { var r = ratio(); view.x = drag.vx + dx * r; view.y = drag.vy + dy * r; apply(); }
    });
    function end(){ drag = null; setTimeout(function(){ dragged = false; }, 0); }
    svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
    function zoom(f, px, py){
      var k = Math.max(0.3, Math.min(3, view.k * f)); f = k / view.k;
      view.x = px - (px - view.x) * f; view.y = py - (py - view.y) * f; view.k = k; apply();
    }
    svg.addEventListener('wheel', function(e){
      e.preventDefault();
      var b = svg.getBoundingClientRect(), r = ratio();
      zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, (e.clientX - b.left) * r, (e.clientY - b.top) * (GH / (b.height || GH)));
    }, {passive:false});
    var tools = h('div', {class:'gtools'},
      h('button', {type:'button', 'aria-label':'Zoomer', onclick:function(){ zoom(1.2, GW / 2, GH / 2); }}, '+'),
      h('button', {type:'button', 'aria-label':'Dézoomer', onclick:function(){ zoom(1 / 1.2, GW / 2, GH / 2); }}, '−'),
      h('button', {type:'button', onclick:function(){ view = fitView(pos); apply(); }}, 'Recentrer'));
    return h('section', {class:'panel gpanel'},
      h('div', {class:'ghead'}, h('h2', {style:'margin:0'}, 'L’entreprise'), tools),
      h('div', {class:'gwrap'}, svg),
      h('div', {class:'legend'},
        h('span', null, h('i', {class:'sw', style:'background:var(--ceo)'}), 'Président'),
        h('span', null, h('i', {class:'sw', style:'background:var(--dir)'}), 'D : directeur (session)'),
        h('span', null, h('i', {class:'sw', style:'background:var(--diable)'}), '! : Avocat du diable'),
        h('span', null, h('i', {class:'sw', style:'background:var(--ctrl)'}), '✓ : Head of Common Sense'),
        h('span', null, h('i', {class:'sw', style:'background:var(--mem)'}), 'M : recrue (sous-agent)'),
        h('span', null, h('i', {class:'ln'}), 'hiérarchie'),
        h('span', null, h('i', {class:'ln dash'}), 'échange en cours'),
        h('span', null, 'glisser pour déplacer, molette pour zoomer')));
  }

  function detail(){
    var m = byId[selected];
    if (!m) return h('aside', {class:'panel side'}, h('p', {class:'empty'}, 'Clique sur un membre.'));
    var links = [];
    var su = sessionUrl(m.session), tu = safeUrl(m.tableau);
    if (su) links.push(h('a', {href:su, target:'_blank', rel:'noopener'}, 'Ouvrir sa session'));
    if (tu) links.push(h('a', {href:tu, target:'_blank', rel:'noopener'}, 'Ouvrir son tableau'));
    var mesFils = fils.filter(function(f){ return arr(f.participants).indexOf(m.id) >= 0 || f.interne === m.id; });
    var mems = equipe.filter(function(x){ return x.parent === m.id && x.type === 'membre'; });
    return h('aside', {class:'panel side', 'aria-live':'polite'},
      h('div', null, h('p', {class:'eyebrow'}, m.type === 'membre' ? 'membre · équipe de ' + nom(m.parent) : ({contradicteur:'contre-pouvoir', controle:'contrôle'}[m.type] || m.type)), h('h2', {style:'margin:4px 0 0'}, m.nom)),
      h('dl', {class:'kv'}, h('dt', null, 'État'), h('dd', null, stateChip(m)),
        m.mission ? [h('dt', null, 'Mission'), h('dd', null, m.mission)] : null,
        m.recrute ? [h('dt', null, 'Recruté'), h('dd', null, m.recrute)] : null,
        m.session ? [h('dt', null, 'Session'), h('dd', {style:'font-family:var(--mono);font-size:.72rem'}, m.session)] : null),
      m.reflexion ? h('div', {class:'think'}, m.reflexion) : h('p', {class:'empty'}, 'Pas encore de réflexion.'),
      links.length ? h('div', {class:'links'}, links) : null,
      mems.length ? h('div', null, h('h3', {style:'margin-bottom:6px'}, 'Son équipe'), h('div', {class:'hist'}, mems.map(function(x){ return h('div', null, h('span', {class:'when'}, ETATS[x.etat] || ''), h('span', null, x.nom + (x.reflexion ? ' : ' + x.reflexion : ''))); }))) : null,
      mesFils.length ? h('div', null, h('h3', {style:'margin-bottom:6px'}, 'Ses fils'), h('div', {class:'hist'}, mesFils.map(function(f){ return h('div', null, h('span', {class:'when'}, FILS[f.type] || f.type), h('span', null, f.sujet + (f.issue ? ' → ' + f.issue : ''))); }))) : null,
      arr(m.historique).length ? h('div', null, h('h3', {style:'margin-bottom:6px'}, 'Historique'), h('div', {class:'hist'}, arr(m.historique).slice().reverse().map(function(x){ return h('div', null, h('span', {class:'when'}, x.quand || ''), h('span', null, x.texte)); }))) : null);
  }

  function partition(){
    var p = arr(data.partition);
    if (!p.length) return null;
    return h('section', {class:'panel'}, h('h2', null, 'Partition du Directeur des opérations'),
      h('div', {class:'phases'}, p.map(function(x){
        var cls = x.etat === 'en cours' ? 'encours' : (x.etat || '');
        return h('div', {class:'phase ' + cls},
          h('span', {class:'meta'}, 'Phase ' + x.n + ' · ' + (x.mode || '') + (x.cout ? ' · ' + x.cout : '')),
          h('strong', null, x.nom),
          arr(x.qui).length ? h('span', {class:'muted'}, arr(x.qui).map(nom).join(', ')) : null,
          x.livrable ? h('span', null, x.livrable) : null);
      })));
  }

  function filsPanel(){
    var ext = fils.filter(function(f){ return !f.interne; }), inner = fils.filter(function(f){ return f.interne; });
    var out = [];
    if (ext.length) out.push(filsSection('Fils entre sessions', ext));
    if (inner.length) out.push(filsSection('Débats dans les équipes', inner));
    return out.length ? h('div', {style:'display:flex;flex-direction:column;gap:22px'}, out) : null;
  }

  function filsSection(titre, liste){
    var sorted = liste.slice().sort(function(a,b){ return (b.live ? 1 : 0) - (a.live ? 1 : 0); });
    return h('section', {class:'panel'}, h('h2', null, titre),
      h('div', {class:'fils'}, sorted.map(function(f){
        var c = 'var(--' + (FILS[f.type] ? f.type : 'coordination') + ')';
        return h('article', {class:'fil' + (f.live ? ' live' : ''), style:'--c:' + c},
          h('div', {class:'head'}, h('h3', null, f.sujet), h('span', {class:'tag'}, (FILS[f.type] || f.type) + (f.live ? ' · en cours' : ''))),
          h('span', {class:'muted', style:'font-size:.78rem'}, (f.interne ? 'Dans l\u2019équipe de ' + nom(f.interne) + ' · ' : '') + arr(f.participants).map(nom).join(' ⇄ ')),
          arr(f.messages).map(function(msg){ return h('div', {class:'msg'}, h('span', {class:'who'}, nom(msg.de) + ' → ' + nom(msg.vers)), h('span', null, msg.texte)); }),
          f.issue ? h('p', {class:'issue'}, h('strong', null, 'Issue : '), f.issue) : null);
      })));
  }

  function consultation(){
    var c = data.consultation;
    if (!c) return null;
    return h('section', {class:'consult' + (c.reponse ? ' done' : '')},
      h('p', {class:'eyebrow', style:'color:var(--theo)'}, c.reponse ? 'Théophile a répondu' : 'Le Président consulte Théophile'),
      h('h2', {style:'margin:0'}, c.question),
      c.pourquoi ? h('p', {class:'muted'}, c.pourquoi) : null,
      h('div', {class:'chips'}, arr(c.choix).map(function(x){ return h('span', {class:'choice'}, x); })),
      c.reponse ? h('p', null, h('strong', null, 'Réponse : '), c.reponse) : null);
  }

  function bas(){
    var l = arr(data.livrables), s = data.synthese, j = arr(data.journal);
    var blocks = [];
    if (l.length) blocks.push(h('section', {class:'panel'}, h('h2', null, 'Livrables'), h('div', {class:'livr'}, l.map(function(x){
      var u = safeUrl(x.lien);
      return h('div', null, h('strong', {style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap'}, u ? h('a', {href:u, target:'_blank', rel:'noopener'}, x.titre) : x.titre, x.verdict ? h('span', {class:'verdict ' + x.verdict}, x.verdict) : null), h('span', {class:'muted', style:'font-size:.78rem'}, 'par ' + nom(x.par) + (!u && x.lien ? ' · ' + x.lien : '')), x.resume ? h('span', null, x.resume) : null);
    }))));
    var ct = arr(data.controles);
    if (ct.length) blocks.push(h('section', {class:'panel'}, h('h2', null, 'Contrôles du Head of Common Sense'), h('div', {class:'ctrl'}, ct.slice().reverse().map(function(x){
      return h('div', null, h('span', {class:'verdict ' + (x.verdict || 'attente')}, x.verdict || 'en cours'), h('span', null, h('strong', null, x.livrable + (x.tour ? ' · tour ' + x.tour : '')), h('br'), h('span', {class:'muted'}, 'responsable : ' + nom(x.responsable)), x.defauts ? [h('br'), x.defauts] : null));
    }))));
    if (s) blocks.push(h('section', {class:'panel'}, h('h2', null, 'Synthèse du Président'), h('div', {class:'synth'},
      [['Recommandation', s.recommandation], ['Accords', s.accords], ['Désaccords', s.desaccords], ['Risques', s.risques], ['Prochaine action', s.action]]
        .filter(function(x){ return x[1]; }).map(function(x){ return h('p', null, h('b', null, x[0]), x[1]); }))));
    if (j.length) blocks.push(h('section', {class:'panel'}, h('h2', null, 'Journal'), h('div', {class:'journal'}, j.slice().reverse().map(function(x){ return h('div', null, h('span', {class:'t'}, x.t), h('strong', {style:'font-size:.76rem'}, nom(x.qui)), h('span', null, x.texte)); }))));
    return blocks.length ? h('div', {class:'grid2'}, blocks) : null;
  }

  function render(){
    var app = document.getElementById('app');
    var nDir = equipe.filter(function(m){ return m.type === 'directeur' && m.session; }).length;
    var nLive = fils.filter(function(f){ return f.live; }).length;
    var parts = [
      h('header', {class:'top'},
        h('p', {class:'eyebrow'}, 'Présidence · tableau principal'),
        h('h1', null, data.titre || 'Présidence'),
        data.probleme ? h('p', {class:'q'}, data.probleme) : null,
        h('div', {class:'chips'},
          data.statut ? h('span', {class:'chip'}, data.statut) : null,
          data.phase ? h('span', {class:'chip'}, 'phase : ' + data.phase) : null,
          h('span', {class:'chip'}, nDir + ' session' + (nDir > 1 ? 's' : '') + ' directeur'),
          nLive ? h('span', {class:'chip', style:'border-color:var(--debat);color:var(--debat)'}, nLive + ' fil' + (nLive > 1 ? 's' : '') + ' en cours') : null)),
      consultation(),
      partition(),
      h('div', {class:'main'}, graph(), detail()),
      filsPanel(),
      bas()];
    app.replaceChildren.apply(app, parts.filter(Boolean));
  }
  render();
})();
</script>
